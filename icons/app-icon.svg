<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <!-- Window body gradient (deep teal) -->
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14877E"/>
      <stop offset="0.55" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#0D6B64"/>
    </linearGradient>
    <!-- Envelope (warm coral) -->
    <linearGradient id="env" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB8B7D"/>
      <stop offset="1" stop-color="#F06654"/>
    </linearGradient>
    <!-- Speech bubble (soft amber) -->
    <linearGradient id="bub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C65A"/>
      <stop offset="1" stop-color="#EFAE32"/>
    </linearGradient>
    <!-- Calendar (off-white) -->
    <linearGradient id="cal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E9EEF4"/>
    </linearGradient>
    <!-- Long shadow fading toward bottom-right -->
    <linearGradient id="long" x1="380" y1="420" x2="900" y2="940" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#042F2C" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#042F2C" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft object shadow -->
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#032B28" flood-opacity="0.28"/>
    </filter>
    <!-- Soft shadow under the whole window -->
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <clipPath id="winClip">
      <rect x="104" y="120" width="816" height="784" rx="160"/>
    </clipPath>
    <clipPath id="envClip">
      <rect x="200" y="300" width="360" height="250" rx="44"/>
    </clipPath>
  </defs>

  <!-- Window: depth base + body -->
  <g filter="url(#winShadow)">
    <rect x="104" y="144" width="816" height="784" rx="160" fill="#0A4F4A"/>
    <rect x="104" y="120" width="816" height="784" rx="160" fill="url(#win)"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- Tab bar -->
    <rect x="104" y="120" width="816" height="132" fill="#0B5F58"/>
    <!-- Active tab (merges into window body) -->
    <path d="M196 252 V200 a36 36 0 0 1 36 -36 H404 a36 36 0 0 1 36 36 V252 Z" fill="#13847B"/>
    <!-- Inactive tab -->
    <rect x="468" y="180" width="168" height="48" rx="24" fill="#0F766E"/>

    <!-- Long shadow cast by the three objects -->
    <polygon points="560,300 1120,860 1120,1140 760,1140 200,560" fill="url(#long)"/>
  </g>

  <!-- Envelope (back) -->
  <g filter="url(#soft)">
    <rect x="200" y="300" width="360" height="250" rx="44" fill="url(#env)"/>
    <g clip-path="url(#envClip)">
      <polyline points="232,330 380,442 528,330" fill="none" stroke="#D9503F"
                stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Speech bubble (middle) -->
  <g filter="url(#soft)">
    <path d="M452 440 H630 a70 70 0 0 1 70 70 V610 a70 70 0 0 1 -70 70 H520
             L428 752 a12 12 0 0 1 -20 -10 L424 680 H452
             a70 70 0 0 1 -70 -70 V510 a70 70 0 0 1 70 -70 Z"
          fill="url(#bub)" stroke="#0F766E" stroke-width="18" stroke-linejoin="round" paint-order="stroke"/>
    <circle cx="470" cy="560" r="26" fill="#B9781B"/>
    <circle cx="541" cy="560" r="26" fill="#B9781B"/>
    <circle cx="612" cy="560" r="26" fill="#B9781B"/>
  </g>

  <!-- Calendar sheet (front) -->
  <g filter="url(#soft)">
    <rect x="560" y="560" width="280" height="300" rx="44" fill="url(#cal)"
          stroke="#0F766E" stroke-width="18" paint-order="stroke"/>
    <!-- Header band -->
    <path d="M560 640 V604 a44 44 0 0 1 44 -44 H796 a44 44 0 0 1 44 44 V640 Z" fill="#F97362"/>
    <!-- Binder rings -->
    <rect x="618" y="528" width="28" height="64" rx="14" fill="#0B5F58"/>
    <rect x="754" y="528" width="28" height="64" rx="14" fill="#0B5F58"/>
    <!-- Date cells -->
    <g fill="#CBD5E1">
      <rect x="594" y="676" width="52" height="52" rx="14"/>
      <rect x="674" y="676" width="52" height="52" rx="14"/>
      <rect x="754" y="676" width="52" height="52" rx="14"/>
      <rect x="594" y="756" width="52" height="52" rx="14"/>
      <rect x="754" y="756" width="52" height="52" rx="14"/>
    </g>
    <rect x="674" y="756" width="52" height="52" rx="14" fill="#0F766E"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
