<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>New Tab — Google Suite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo-wrapper">
        <div class="g-logo">
          <img src="../icons/app-icon.svg" width="40" height="40" alt="" />
        </div>
        <h1>Google Suite</h1>
      </div>
      <p class="subtitle">Select an application or enter a search query</p>

      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20">
          <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
        <input
          type="text"
          id="search-input"
          placeholder="Search Google or enter an address..."
          autofocus
          autocomplete="off"
          spellcheck="false"
        />
      </div>
    </header>

    <main class="grid-container">
      <div id="apps-grid" class="apps-grid"></div>
    </main>
  </div>

  <script src="../svg-icons.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
