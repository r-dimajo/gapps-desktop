<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="strip">
    <!-- Header shown only in vertical mode -->
    <div id="sidebar-header" class="v-only">
      <div class="sidebar-brand">
        <span class="brand-icon"></span>
        <span class="brand-title">Google Suite</span>
      </div>
      <button id="toggle-layout-top" class="icon-btn" title="Switch to top tabs (Alt+Shift+V)"></button>
    </div>

    <!-- New Tab button and Horizontal Layout Toggle -->
    <div id="new-tab-wrapper">
      <button id="new" title="New tab (+)">
        <span class="btn-icon">+</span>
        <span class="btn-text v-only">New tab</span>
      </button>
      <button id="toggle-layout-strip" class="h-only icon-btn" title="Switch to vertical tabs (Alt+Shift+V)"></button>
    </div>

    <!-- Tabs Container -->
    <div id="tabs"></div>

    <!-- Draggable / spacer area -->
    <div id="drag"></div>

    <!-- Controls / Footer -->
    <div id="controls">
      <div id="url-bar" class="url-bar" title="Current tab URL">
        <span class="url-icon">🔒</span>
        <span id="url-text" class="url-text"></span>
        <button id="url-copy" class="url-copy-btn" title="Copy URL">&#128203;</button>
      </div>
      <div class="controls-buttons">
        <button id="reload" title="Reload active tab (Ctrl+R)">&#10227;</button>
        <button id="gear" title="Settings">&#9881;</button>
      </div>
    </div>
  </div>
  <script src="../svg-icons.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
